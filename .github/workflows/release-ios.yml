name: Release iOS

# Cutting an iOS release is a single action: push a version tag (e.g. `v0.1.2`).
# This builds a signed App Store `.ipa` and uploads it to TestFlight via the
# App Store Connect API. From there you promote the build to the App Store in
# App Store Connect. Signing an iOS build needs Apple's toolchain, so this runs
# on a macOS runner (the Android job stays on ubuntu).
on:
  push:
    tags:
      - "v*"
  # Manual run: ship another TestFlight build without a new marketing version.
  # Keeps CFBundleShortVersionString fixed and only bumps the build number, so
  # the upload needs no new App Review (internal testers get it immediately).
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (CFBundleShortVersionString), e.g. 0.1.1"
        required: true
        default: "0.1.1"
      build_number:
        description: "Build number (CFBundleVersion); must exceed the last upload for that version"
        required: true

permissions:
  contents: write # needed to attach the .ipa to the GitHub Release

jobs:
  build-ipa:
    # Apple requires builds made with the iOS 26 SDK (Xcode 26+) for App Store
    # Connect uploads, so the iOS job runs on the macos-26 image.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # macos-26 ships several Xcode versions; pin to the newest stable one so the
      # build uses the iOS 26 SDK that App Store Connect now mandates.
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7 # keep in step with the local toolchain
          cache: true

      # The tag drives the version: `v0.1.2` -> CFBundleShortVersionString 0.1.2.
      # The build number is the monotonic workflow run number so every upload to
      # App Store Connect is unique (it rejects a repeated build number).
      # A tag push (v0.1.2) sets the marketing version from the tag — a real,
      # reviewable App Store version. A manual run keeps the version fixed and
      # only bumps the build number, so the upload goes to TestFlight review-free.
      - name: Resolve version and build number
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "build=${{ github.event.inputs.build_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      # Import the Apple Distribution certificate (.p12) into a throwaway keychain
      # so codesign can find it, then unlock it for the build.
      - name: Import signing certificate
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dist-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "$CERT_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$CERT_PATH"

      # Install the App Store provisioning profile where Xcode looks for it.
      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_DIR/sarv_authenticator.mobileprovision"

      # Credentials for uploading to App Store Connect (App Store Connect API key).
      # The .p8 is written where xcrun altool / notarytool can read it by ID.
      - name: Write App Store Connect API key
        env:
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          KEY_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$ASC_KEY_BASE64" | base64 --decode > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_DIR=$KEY_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get

      # ios/ExportOptions.plist (committed) selects app-store-connect export with
      # manual signing against the installed distribution cert + profile.
      - name: Build signed release IPA
        run: >
          flutter build ipa --release
          --build-name=${{ steps.ver.outputs.name }}
          --build-number=${{ steps.ver.outputs.build }}
          --export-options-plist=ios/ExportOptions.plist

      - name: Name the artifact
        run: |
          mv build/ios/ipa/*.ipa \
             sarv-otp-v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.build }}.ipa

      # Upload to App Store Connect / TestFlight. altool authenticates with the
      # API key written above; no Apple ID password or 2FA is involved.
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: >
          API_PRIVATE_KEYS_DIR="$ASC_KEY_DIR"
          xcrun altool --upload-app --type ios
          --file sarv-otp-v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.build }}.ipa
          --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      # Release notes are the curated CHANGELOG.md entry for this version, not
      # scraped commit subjects. generate_release_notes is off so nothing is
      # appended (both the iOS and Android jobs publish the same body for the tag).
      - name: Build release notes from CHANGELOG
        run: bash .github/scripts/changelog-section.sh "${{ steps.ver.outputs.name }}" CHANGELOG.md RELEASE_NOTES.md

      # Only a tagged version is a real release; a manual build-only run uploads
      # to TestFlight and does not create or touch a GitHub Release.
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: sarv-otp-v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.build }}.ipa
          body_path: RELEASE_NOTES.md
          generate_release_notes: false

      # Secrets are written to the workspace / keychain; remove them even though
      # the runner is ephemeral, so a later step can never read the material.
      - name: Scrub signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/build.keychain-db"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/sarv_authenticator.mobileprovision"
