name: Release Android

# Cutting a release is a single action: push a version tag (e.g. `v0.1.2`).
# This builds a signed release APK (attached to a GitHub Release for sideloading)
# and a signed release AAB. When the PLAY_SERVICE_ACCOUNT_JSON secret is present,
# the AAB is also uploaded to Google Play's `internal` testing track; without that
# secret the Play step is skipped, so the APK/GitHub path keeps working unchanged.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the GitHub Release and upload the APK

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7 # keep in step with the local toolchain
          cache: true

      # The tag drives the version: `v0.1.2` -> versionName 0.1.2. The build
      # number is the monotonic workflow run number so every release differs.
      - name: Resolve version from tag
        id: ver
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build signed release APK
        run: >
          flutter build apk --release
          --build-name=${{ steps.ver.outputs.name }}
          --build-number=${{ github.run_number }}

      - name: Name the artifact after the tag
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             sarv-otp-${{ github.ref_name }}.apk

      # Google Play distributes App Bundles, not APKs. Same signing config and the
      # same monotonic versionCode as the APK, so Play never sees a duplicate.
      - name: Build signed release App Bundle (AAB)
        run: >
          flutter build appbundle --release
          --build-name=${{ steps.ver.outputs.name }}
          --build-number=${{ github.run_number }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: sarv-otp-${{ github.ref_name }}.apk
          generate_release_notes: true

      # Only attempt a Play upload when the service-account secret is configured;
      # otherwise this tag just produces the APK + GitHub Release as before.
      - name: Detect Play credentials
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "PLAY_SERVICE_ACCOUNT_JSON not set - skipping Play upload." >&2
          fi

      # The app must already exist in the Play Console and have its required
      # declarations (listing, content rating, data safety) completed before an
      # API upload is accepted. Promote internal -> production in the Console.
      - name: Upload AAB to Google Play (internal track)
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sarv.otp
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      # Secrets are written to the workspace as files; remove them even though the
      # runner is ephemeral, so a later step can never read the signing material.
      - name: Scrub signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
