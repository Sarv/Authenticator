# Static analysis for Sarv OTP.
# Starts from the recommended Flutter lints and tightens a few rules that
# matter for a security-sensitive, functional-leaning codebase.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # A stray debug print should break the build, not slip into a release.
    avoid_print: error
  exclude:
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_final_in_for_each
    - avoid_redundant_argument_values
    - unnecessary_await_in_return
    - require_trailing_commas
    - use_super_parameters
    - sort_child_properties_last
    - prefer_relative_imports
    - directives_ordering
